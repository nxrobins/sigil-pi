name: CI

# sigil-pi's real gate is ./ci.sh, and ci.sh cannot run without a built SIGIL
# toolchain (every tool is forged by sigil-mcp/sigil-serve from a sibling
# checkout). CI has two mandatory jobs:
#
#   standalone — everything that needs no toolchain: parsing, lint, the pin
#                format, and the tests that never forge. Runs on every PR.
#   forge      — the full ./ci.sh gate against the immutable SIGIL ref, fetched
#                anonymously from the public github.com/nxrobins/sigil.
#
# BOTH JOBS ARE MANDATORY. The forge job has no job-level gate: a pinned ref
# that is not reachable in the public repo makes it RED, naming the ref,
# before the checkout. It used to be gated on a repo-read token (SIGIL was
# private until 2026-09-04) and SKIP visibly (a step-level gate once reported a
# green "success" in ~7s while running nothing, which is worse than no check;
# the job-level skip at least said what it did). The product-readiness record
# replaced the skip with a failure on purpose: branch protection counts a
# skipped required check as satisfied, so a release gate that can be
# satisfied by not running is not a gate.
#
# THE REAL GATE IS ENABLED: forge has run the full ./ci.sh on every PR and
# every push to main since 2026-08-02. The `ref` in SIGIL_REV must be PUBLIC —
# present in nxrobins/sigil, not only in the private sigil-dev — for CI to
# fetch a candidate, and the tree-hash check inside ci.sh remains the
# authority; the ref is only how CI gets there.
#
# NAME COLLISION, recorded so it is not relearned: GitHub repository names
# are case-insensitive, so the private repo's old capitalised name and the
# public repo's lowercase one are ONE name. When the private repo was renamed
# sigil-dev and the public export took the old name, the checkout below
# silently pointed at the public repo at a ref only the private one had. The
# spelling here is the one GitHub canonicalises to, and a guard pins it.

on:
  # No `branches:` filter on pull_request. That filter matches the BASE branch,
  # so `branches: [main]` silently gives ZERO checks to any stacked PR (one
  # based on another branch) — a check that does not check, which is worse than
  # no check at all. Found the first time a PR was stacked here. Run on every
  # PR regardless of base; push stays scoped to main so merges are verified once.
  pull_request:
  push:
    branches: [main]

jobs:
  standalone:
    name: standalone (no toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Every Python file parses
        run: python -m compileall -q agent.py product_service.py product_main.py runtime_client.py sigil_compose.py state_tool.py chat.py drive.py make_chat_turn.py scripts tests

      - name: Lint (pyflakes-level, same invocation as ci.sh)
        # real-bug rules only — a guard test pins this to match ci.sh exactly
        run: |
          pip install --quiet -r requirements-dev.lock
          python -m ruff check --select F,E9 .

      - name: SIGIL_REV is well-formed
        # A malformed pin silently disables the toolchain check in ci.sh, which
        # is exactly the failure this file exists to prevent.
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          cfg = {}
          for line in Path("SIGIL_REV").read_text().splitlines():
              line = line.split("#", 1)[0].strip()
              if "=" in line:
                  k, v = line.split("=", 1)
                  cfg[k.strip()] = v.strip()
          missing = [k for k in ("crates", "stdlib", "ref") if k not in cfg]
          if missing:
              sys.exit(f"SIGIL_REV is missing required key(s): {missing}")
          for k in ("crates", "stdlib"):
              if not re.fullmatch(r"[0-9a-f]{40}", cfg[k]):
                  sys.exit(f"SIGIL_REV `{k}` is not a 40-char git tree hash: {cfg[k]!r}")
          # `ref` must be the FULL sha: actions/checkout treats anything
          # shorter as a branch/tag name, fetches refs/heads/<ref>*, matches
          # nothing, and dies with an error naming neither ref nor cause.
          if not re.fullmatch(r"[0-9a-f]{40}", cfg["ref"]):
              sys.exit(f"SIGIL_REV `ref` must be a FULL 40-char commit sha "
                       f"(actions/checkout reads anything shorter as a branch "
                       f"name and fails opaquely): {cfg['ref']!r}")
          print("SIGIL_REV ok:", {k: cfg[k][:12] for k in ("crates", "stdlib", "ref")})
          PY

      - name: The toolchain-free tests
        # The first time this job checks BEHAVIOUR rather than shape. Since the
        # toolchain is resolved lazily (toolchain.py), every test that never
        # forges — audit-chain math, compaction, scheduler timing, the memory
        # client against its protocol double, the product service against
        # scripted agents — runs with no SIGIL at all. They used to be
        # unreachable to anyone outside the private repo, not for any reason
        # of their own but because conftest.py imported it at module scope.
        #
        # Deliberately WITHOUT PI_REQUIRE_TOOLCHAIN: here a skipped forge test
        # is correct, and the forge job sets that variable to make the same
        # skip a failure where it would be a lie. Dependencies come from the
        # lock the lint step installed.
        run: python -m pytest -q

      - name: ci.sh is executable and syntactically valid
        # ci.sh is `#!/bin/zsh` and ubuntu-latest does not ship zsh. Check it
        # with the shell that actually runs it — validating with bash instead
        # would be a weaker check that could pass on syntax zsh rejects.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          test -x ci.sh || { echo "ci.sh is not executable"; exit 1; }
          zsh -n ci.sh

  forge:
    name: full ./ci.sh gate (needs SIGIL)
    runs-on: ubuntu-24.04
    env:
      # The gate builds a SOLVER-VERIFYING compiler (ci.sh step 1 says why), and
      # that links libz3. Pinned to the same official Z3 release SIGIL's own
      # solver lane pins, SHA256-verified before anything is installed (apt's
      # libz3 predates z3-sys 0.8.1's API). Every resolution path — bindgen
      # header, linker, loader — points at the one unzipped asset.
      Z3_VERSION: "4.12.2"
      Z3_ASSET: "z3-4.12.2-x64-glibc-2.35"
      Z3_SHA256: "29604c87d74855690f5f43fa2ecb8e214af89bdddffac378ce403e29c6ea30ec"
      Z3_SYS_Z3_HEADER: ${{ github.workspace }}/z3-pinned/include/z3.h
      LIBRARY_PATH: ${{ github.workspace }}/z3-pinned/bin
      LD_LIBRARY_PATH: ${{ github.workspace }}/z3-pinned/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sigil-pi

      - name: Read the pinned ref
        id: pin
        run: |
          ref=$(sed -n 's/^[[:space:]]*ref[[:space:]]*=[[:space:]]*//p' sigil-pi/SIGIL_REV | head -1)
          if [ -z "$ref" ]; then
            echo "SIGIL_REV has no \`ref\` key — CI needs one to know what to check out." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: The pinned SIGIL ref is public (this gate cannot be skipped)
        # A job-level skip is exactly what this gate must not do (see the
        # header), so the check is a STEP that fails naming the cause. Without
        # it a ref that exists only in the private sigil-dev dies inside
        # actions/checkout below with an error naming neither the ref nor the
        # reason — the exact shape of the 2026-09-04 name collision.
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/nxrobins/sigil/commits/$REF")
          if [ "$code" != "200" ]; then
            echo "::error::SIGIL_REV ref $REF is not reachable in the public github.com/nxrobins/sigil (HTTP $code). The pin must name a PUBLIC commit; one that exists only in the private sigil-dev cannot be a release-gate input."
            exit 1
          fi
          echo "SIGIL ref $REF is public"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nxrobins/sigil
          ref: ${{ steps.pin.outputs.ref }}
          path: SIGIL

      - name: Install pinned Z3 (official release binary, SHA256-verified)
        # A hash mismatch fails BEFORE any file is installed, and the runner
        # image's own Z3 is evicted so no shadow copy can win a resolution path.
        run: |
          set -euo pipefail
          curl -sSfL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_ASSET}.zip"
          echo "${Z3_SHA256}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          mv "${Z3_ASSET}" z3-pinned
          sudo rm -f /usr/local/bin/z3 /usr/local/lib/libz3* /usr/local/include/z3*.h /usr/lib/libz3* /usr/include/z3*.h
          sudo ldconfig
          ./z3-pinned/bin/z3 --version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        # Must equal the `channel` in the checkout's rust-toolchain.toml: rustup
        # obeys that file for every cargo call inside SIGIL/, so a different
        # version here is a second toolchain downloaded and never used.
        with:
          toolchain: 1.98.0

      - name: Install the pinned Lean verifier toolchain
        # The compiler STATICALLY LINKS a Lean-built kernel: sigil-formal-bridge's
        # build.rs probes `lake`, compiles four LambdaSigil modules to C and links
        # them, and panics without it — "failed to run pinned Lean version probe",
        # the first forge run against the public tree (run 34015201659), after
        # every step that had a name had passed. Build-time only: the produced
        # binaries need no Lean on the host.
        #
        # The version is SIGIL's pin (proofs/lean/lean-toolchain in the checkout),
        # READ rather than copied, so there is no second place for it to drift.
        # SIGIL's own composite action does exactly this, but its paths assume the
        # checkout is the workspace root, and here it is SIGIL/. The elan installer
        # script is SHA256-pinned the way Z3 is; elan then fetches the named
        # toolchain over HTTPS from leanprover's releases.
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          toolchain="$(tr -d '\r\n' < SIGIL/proofs/lean/lean-toolchain)"
          elan toolchain install "$toolchain"
          (cd SIGIL/proofs/lean && lake env lean --version)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: SIGIL

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Create the venv ci.sh expects
        working-directory: sigil-pi
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements-dev.lock

      - name: ./ci.sh
        # ci.sh builds the forge binaries itself (at the pin — issue #6), so
        # there is no separate build step to drift out of sync with it.
        working-directory: sigil-pi
        env:
          SIGIL_ROOT: ${{ github.workspace }}/SIGIL
          # This job exists to run the FORGE tests. Without this, a toolchain
          # that failed to resolve would turn all ~221 of them into skips and
          # the job would report green having verified nothing — the same lie
          # the job-level gate above prevents, one layer down. Set here rather
          # than in ci.sh so the requirement travels with the job that makes
          # the claim.
          PI_REQUIRE_TOOLCHAIN: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          ./ci.sh
