# sigil-pi packaging.
#
# The Python side has NO third-party runtime dependencies — agent.py imports
# only the standard library plus this repo's own toolchain module. That is not
# an accident of a small project: the host is the trusted orchestrator for
# sandboxed guests, and every runtime dependency it takes on is code running
# outside the sandbox with the operator's api key in the same process.
#
# What sigil-pi is NOT self-contained in is the FORGE: every tool is compiled
# and run by a sigil-mcp binary built from SIGIL, and every guest is composed
# against SIGIL's stdlib. Neither can be expressed as a Python dependency, so
# they are resolved at runtime — see toolchain.py for the three arrangements
# and the precedence between them. Installing this package therefore gets you
# the host; it does not get you a toolchain, and `pi --verify-audit` is the
# only entry point that works without one (deliberately: an auditor should
# never need a compiler to check a record).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-pi"
version = "0.4.0"           # tracks ./VERSION — the product release line
description = "The pi agent framework in SIGIL — the sandbox is the type system"
readme = "README.md"
# The supported range is defined ONCE, in toolchain.py (MINIMUM_PYTHON and
# FIRST_UNSUPPORTED_PYTHON); product_main.py and state_tool.py refuse anything
# outside it at startup, and the release SBOM is stamped from it. This line
# restates it for pip, and tests/test_python_support.py fails when the two
# disagree. It said ">=3.12" while the support matrix and the SBOM said <3.15
# (audit F-24).
requires-python = ">=3.12,<3.15"
dependencies = []           # see the header — this is load-bearing, not empty

[project.optional-dependencies]
# Mirrors requirements-dev.lock, which is what ci.sh's header and both CI jobs
# install, so a contributor who installs the extra gets the gate's environment
# rather than a near-miss. Keep the two in step (tests/test_dev_environment.py
# checks it). The lock is the one to install: it also pins every dependency of
# these, by hash.
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",    # pytest.ini requires it: every test has a time limit
    "coverage==7.15.4",
    "hypothesis==6.163.0",
    "ruff==0.16.1",
]

[project.scripts]
pi = "agent:main"                 # the research host (loopback REPL / POST /chat)
sigil-pi = "product_main:main"    # the authenticated /v1 product host

[tool.setuptools]
# Top-level modules rather than a package: this repo is a flat layout by
# history, and reshaping it into src/sigil_pi/ would rewrite every import in
# the suite for no gain the toolchain seam does not already deliver. chat.py and
# drive.py, the milestone-1 drivers, are NOT installed: they import SIGIL's bench
# client at module scope, so they run only from a checkout beside SIGIL (README,
# "the early milestone demos") and an installed `chat` or `drive` would fail to
# import (audit F-20).
py-modules = [
    "agent", "toolchain", "make_chat_turn",
    # the v1 product host and the vendored runtime client it forges through
    "product_main", "product_service", "runtime_client", "sigil_compose",
    "state_tool",
]

[tool.ruff]
# Mirrors ci.sh and the standalone CI job. A guard test pins that all three
# agree, because the weakest gate quietly becomes the real one when they drift.
lint.select = ["F", "E9"]
