name: Failure drill

# The six-category failure-injection matrix against the exact candidate
# (docs/product-readiness.md areas 3 and 4). It runs HERE for the same two
# reasons the recovery drill does: the published artifacts are linux-x86_64 and
# their embedded runtime cannot exec on a development Mac, and a hosted runner
# is a clean host. It also needs one thing the recovery drill does not — the
# privilege to mount a small tmpfs, because "full disks" is only evidence if a
# real filesystem really fills.
#
# What makes this run EVIDENCE rather than an exercise is binding, checked
# before anything is injected:
#   - the downloaded artifact must verify against docs/evidence/candidate.json
#     (digest, inner manifest, VERSION, SBOM pin, payload parity);
#   - the report is stamped with THIS run's immutable URL, so the raw evidence
#     the readiness gate reads names the run that produced it;
#   - the run signs the report (the attest job), so the gate can tell the
#     bytes this run wrote from a report typed by hand or edited afterwards
#     (audit 2026-11-10, F-19): product-ci.sh accepts failure-injection.json
#     only with an attestation of its exact bytes by this workflow, run from
#     main on a GitHub-hosted runner. Commit the report byte for byte as the
#     run's artifact holds it.
#
# Dispatch-only: a drill is run deliberately, against a named tag, and its
# report is retained as evidence — it is not a per-push check. Run it from
# main: a run from any other branch is signed, but its last step refuses the
# signature, as the gate would.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the candidate release (must match docs/evidence/candidate.json)"
        default: "v0.4.0"
        required: true
      bounded_filesystem_mb:
        description: "size of the tmpfs the full-disk category exhausts"
        default: "64"
        required: true

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      # The report's digest, for the attest job to check the bytes it signs.
      report_sha256: ${{ steps.report.outputs.sha256 }}
    env:
      # The bundle's sigil-mcp links libz3 dynamically, and the drill boots the
      # service with a deliberately minimal environment that does NOT carry
      # LD_LIBRARY_PATH — exactly like a production host, which must PROVIDE
      # the library. So the pinned Z3's shared library goes into the loader's
      # default path rather than being smuggled in through an environment
      # variable the real deployment would not have.
      Z3_VERSION: "4.12.2"
      Z3_ASSET: "z3-4.12.2-x64-glibc-2.35"
      Z3_SHA256: "29604c87d74855690f5f43fa2ecb8e214af89bdddffac378ce403e29c6ea30ec"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The job's token stays out of .git/config, where every later step
          # and every release the drill starts could read it.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: The host can bound a filesystem
        # Checked FIRST and loudly. Without it the full-disk category cannot
        # inject anything real, and the drill would spend forty minutes to
        # produce a report that says so — the drill refuses to fake it, and
        # this refuses to waste the run.
        run: |
          set -euo pipefail
          sudo -n true
          probe=$(mktemp -d)
          trap 'mountpoint -q "$probe" && sudo -n umount "$probe"; rmdir "$probe"' EXIT
          sudo -n mount -t tmpfs -o size=8m,uid=$(id -u),gid=$(id -g) tmpfs "$probe"
          cc --version

      - name: Install the pinned Z3 shared library into the loader path
        run: |
          set -euo pipefail
          curl -sSfL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_ASSET}.zip"
          echo "${Z3_SHA256}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          sudo cp "${Z3_ASSET}/bin/libz3.so" /usr/local/lib/
          sudo ldconfig
          ldconfig -p | grep libz3

      - name: Download the published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$CANDIDATE_TAG" =~ $release_tag ]]; then
            # What was typed is not echoed into the log.
            echo "tag is not a release tag (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          gh release download "$CANDIDATE_TAG" --pattern '*.tar.gz' -D candidate
          ls -la candidate

      - name: Bind the artifact to the frozen candidate record
        # The drill proves failure handling for THE candidate, not for whatever
        # was downloaded. Verified in full before a single injection, because a
        # report about an unverified archive is not evidence about the release.
        run: |
          set -euo pipefail
          archive=$(ls candidate/*.tar.gz)
          python scripts/build_release.py --verify "$archive" --record docs/evidence/candidate.json

      - name: Run the failure drill
        env:
          FILESYSTEM_MB: ${{ inputs.bounded_filesystem_mb }}
          EVIDENCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          python -c "import secrets; print(secrets.token_hex(32))" > audit.key
          chmod 600 audit.key
          python scripts/failure_drill.py \
            --artifact "$(ls candidate/*.tar.gz)" \
            --audit-key-file audit.key \
            --evidence-url "$EVIDENCE_URL" \
            --bounded-filesystem-mb "$FILESYSTEM_MB" \
            --work-dir drill-work \
            --output failure-injection.json
          python - <<'PY'
          import json
          report = json.load(open("failure-injection.json"))
          print("artifact:", report["artifact"])
          print("qualification_eligible:", report["qualification_eligible"])
          print("failures:", report["qualification_failures"])
          print("bounded filesystem:", report["topology"]["bounded_filesystem"],
                report["topology"].get("bounded_filesystem_detail"))
          for name, result in sorted(report["categories"].items()):
              print(f"  {name}: passed={result['passed']} "
                    f"integrity={result['state_integrity_verified']} "
                    f"recovered={result['service_recovered']}")
              print(f"    observed: {result['observed_behavior']}")
              if result["failures"]:
                  print(f"    FAILURES: {result['failures']}")
          PY

      - name: Record the report's digest for the attest job
        id: report
        run: |
          set -euo pipefail
          digest=$(sha256sum failure-injection.json | cut -d' ' -f1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Preserve the raw evidence
        # Uploaded, never auto-committed: docs/evidence/ is written by a human
        # who has read the report, the way the recovery drill's was.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-injection-${{ inputs.tag }}
          path: |
            failure-injection.json
            drill-work/**/*-service.log
          if-no-files-found: error

  attest:
    # Signs the report the drill job wrote (audit 2026-11-10, F-19). Its token
    # can mint this run's identity and store an attestation, which is to say
    # sign anything as this workflow, so it is this job's alone, and the job
    # runs nothing of the repository's or of what the drill started: no
    # checkout, no interpreter, only the two pinned actions release.yml signs
    # with, sha256sum and gh. It runs only after a drill that passed, the only
    # report the gate accepts; a failed drill's report stays, unsigned, in the
    # artifact the drill job uploaded.
    needs: drill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Take the report the drill job kept
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: evidence
          merge-multiple: true

      - name: Check the report against the drill job's digest
        env:
          REPORT_SHA256: ${{ needs.drill.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          if ! [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "the drill job reported no digest for its report" >&2
            exit 1
          fi
          echo "$REPORT_SHA256  evidence/failure-injection.json" | sha256sum --check --strict -

      - name: Sign the report
        # A literal path and no predicate: one subject, the report, signed as
        # SLSA build provenance naming this workflow, this commit and this run.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: evidence/failure-injection.json

      - name: Verify the signature as the readiness gate does
        # The command scripts/check_readiness_evidence.py runs before
        # product-ci.sh accepts the report, so a signature the gate would
        # refuse (from a run on another branch, say) fails this run instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify evidence/failure-injection.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/failure-drill.yml" \
            --source-ref refs/heads/main \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners
