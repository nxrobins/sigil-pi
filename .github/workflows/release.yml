name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-test-attest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sigil-pi

      - name: Require the tag to equal VERSION
        working-directory: sigil-pi
        run: |
          expected="v$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          }

      - name: Read the immutable SIGIL ref
        id: pin
        working-directory: sigil-pi
        run: |
          ref=$(sed -n 's/^[[:space:]]*ref[[:space:]]*=[[:space:]]*//p' SIGIL_REV | head -1)
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nxrobins/SIGIL
          token: ${{ secrets.SIGIL_REPO_TOKEN }}
          ref: ${{ steps.pin.outputs.ref }}
          path: SIGIL

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: SIGIL

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - name: Run the mandatory product gate
        working-directory: sigil-pi
        env:
          SIGIL_ROOT: ${{ github.workspace }}/SIGIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements-dev.lock
          ./ci.sh

      - name: Build and verify deterministic release assets
        working-directory: sigil-pi
        run: |
          .venv/bin/python scripts/build_release.py \
            --sigil-root "${{ github.workspace }}/SIGIL" --output dist --no-build
          cd dist
          sha256sum --check --strict ./*.tar.gz.sha256

      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: sigil-pi/dist/sigil-pi-*.tar.gz.sha256

      - name: Sign SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: sigil-pi/dist/sigil-pi-*.tar.gz.sha256
          sbom-path: sigil-pi/dist/sigil-pi-*.SBOM.cdx.json

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigil-pi-${{ github.ref_name }}
          path: sigil-pi/dist/*
          if-no-files-found: error

      - name: Publish immutable tag assets
        working-directory: sigil-pi
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
