[package]
name = "sigil-fixed-evaluator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sigil-compiler = { git = "https://github.com/nxrobins/sigil", rev = "09939979163f7bcca5443b1060c93b0eed4ddb28", default-features = false, features = ["json", "solver"] }
sigil-runtime = { git = "https://github.com/nxrobins/sigil", rev = "09939979163f7bcca5443b1060c93b0eed4ddb28", features = ["solver"] }
sigil-worker-bridge = { path = "../worker" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "sigil-fixed-evaluator"
path = "src/main.rs"
