name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-test-attest:
    runs-on: ubuntu-24.04
    env:
      # The gate builds a SOLVER-VERIFYING compiler (ci.sh step 1 says why), and
      # that links libz3. Pinned to the same official Z3 release SIGIL's own
      # solver lane pins, SHA256-verified before anything is installed (apt's
      # libz3 predates z3-sys 0.8.1's API). Every resolution path — bindgen
      # header, linker, loader — points at the one unzipped asset.
      Z3_VERSION: "4.12.2"
      Z3_ASSET: "z3-4.12.2-x64-glibc-2.35"
      Z3_SHA256: "29604c87d74855690f5f43fa2ecb8e214af89bdddffac378ce403e29c6ea30ec"
      Z3_SYS_Z3_HEADER: ${{ github.workspace }}/z3-pinned/include/z3.h
      LIBRARY_PATH: ${{ github.workspace }}/z3-pinned/bin
      LD_LIBRARY_PATH: ${{ github.workspace }}/z3-pinned/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sigil-pi

      - name: Require the tag to equal VERSION
        working-directory: sigil-pi
        run: |
          expected="v$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          }

      - name: Read the immutable SIGIL ref
        id: pin
        working-directory: sigil-pi
        run: |
          ref=$(sed -n 's/^[[:space:]]*ref[[:space:]]*=[[:space:]]*//p' SIGIL_REV | head -1)
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nxrobins/sigil
          ref: ${{ steps.pin.outputs.ref }}
          path: SIGIL

      - name: Install pinned Z3 (official release binary, SHA256-verified)
        # A hash mismatch fails BEFORE any file is installed, and the runner
        # image's own Z3 is evicted so no shadow copy can win a resolution path.
        run: |
          set -euo pipefail
          curl -sSfL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_ASSET}.zip"
          echo "${Z3_SHA256}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          mv "${Z3_ASSET}" z3-pinned
          sudo rm -f /usr/local/bin/z3 /usr/local/lib/libz3* /usr/local/include/z3*.h /usr/lib/libz3* /usr/include/z3*.h
          sudo ldconfig
          ./z3-pinned/bin/z3 --version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install the pinned Lean verifier toolchain
        # The compiler STATICALLY LINKS a Lean-built kernel: sigil-formal-bridge's
        # build.rs probes `lake`, compiles four LambdaSigil modules to C and links
        # them, and panics without it — "failed to run pinned Lean version probe",
        # the first forge run against the public tree (run 34015201659), after
        # every step that had a name had passed. Build-time only: the produced
        # binaries need no Lean on the host.
        #
        # The version is SIGIL's pin (proofs/lean/lean-toolchain in the checkout),
        # READ rather than copied, so there is no second place for it to drift.
        # SIGIL's own composite action does exactly this, but its paths assume the
        # checkout is the workspace root, and here it is SIGIL/. The elan installer
        # script is SHA256-pinned the way Z3 is; elan then fetches the named
        # toolchain over HTTPS from leanprover's releases.
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          toolchain="$(tr -d '\r\n' < SIGIL/proofs/lean/lean-toolchain)"
          elan toolchain install "$toolchain"
          (cd SIGIL/proofs/lean && lake env lean --version)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: SIGIL

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: sigil-pi/.node-version

      - name: Locked browser development dependencies and Chromium
        working-directory: sigil-pi
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Run the mandatory product gate
        working-directory: sigil-pi
        env:
          SIGIL_ROOT: ${{ github.workspace }}/SIGIL
          PI_REQUIRE_TOOLCHAIN: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements-dev.lock
          ./ci.sh

      - name: Build and verify deterministic release assets
        id: assets
        working-directory: sigil-pi
        # The exact filenames are RESOLVED here and passed on as outputs. Only
        # `subject-path` accepts a glob in actions/attest; `subject-checksums`
        # and `sbom-path` are plain paths, and a glob given to them finds
        # nothing — which for provenance means signing ZERO subjects while
        # reporting success.
        run: |
          set -euo pipefail
          .venv/bin/python scripts/build_release.py \
            --sigil-root "${{ github.workspace }}/SIGIL" --output dist --no-build
          name="sigil-pi-$(tr -d '\n' < VERSION)-linux-x86_64"
          cd dist
          sha256sum --check --strict "$name.tar.gz.sha256"
          for asset in "$name.tar.gz" "$name.tar.gz.sha256" "$name.SBOM.cdx.json"; do
            test -f "$asset" || { echo "::error::release asset missing: $asset"; exit 1; }
          done
          {
            echo "archive=sigil-pi/dist/$name.tar.gz"
            echo "checksums=sigil-pi/dist/$name.tar.gz.sha256"
            echo "sbom=sigil-pi/dist/$name.SBOM.cdx.json"
          } >> "$GITHUB_OUTPUT"

      # ATTESTATION IS CONDITIONAL, and the condition is a platform fact rather
      # than a preference: GitHub refuses to persist attestations for
      # user-owned PRIVATE repositories ("Feature not available for user-owned
      # private repositories. To enable this feature, please make this
      # repository public." — measured on tag v0.1.0, 2026-08-23). Skipping
      # rather than failing keeps a release publishable today and makes it
      # attested automatically the day the repository is public, with no
      # workflow change. What it must NOT do is let the release claim evidence
      # it does not have: the summary step below records which happened, and
      # docs/product-readiness.md area 1 says a release without attestation
      # cannot satisfy the reproducible-release gate.
      - name: Sign build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}

      - name: Sign SBOM attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}
          sbom-path: ${{ steps.assets.outputs.sbom }}

      - name: Verify the attestations bind to the real artifact
        if: ${{ !github.event.repository.private }}
        # BEFORE publishing, because an attestation that signed nothing is
        # worse than no attestation: it is a claim nobody checked. This is the
        # step that would have caught the glob defect.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "${{ steps.assets.outputs.archive }}" \
            --repo "${{ github.repository }}" --predicate-type \
            https://slsa.dev/provenance/v1
          gh attestation verify "${{ steps.assets.outputs.archive }}" \
            --repo "${{ github.repository }}" --predicate-type \
            https://cyclonedx.org/bom

      - name: Record whether this release is attested
        # An operator reading the release must be able to tell, without digging
        # through workflow logs, whether these bytes carry signed provenance.
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::warning::Published WITHOUT attestations: GitHub does not persist them for user-owned private repositories. This release cannot satisfy docs/product-readiness.md area 1 until the repository is public and a tag is re-cut."
          else
            echo "::notice::Published with signed provenance and SBOM attestations."
          fi

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigil-pi-${{ github.ref_name }}
          path: sigil-pi/dist/*
          if-no-files-found: error

      - name: Publish immutable tag assets
        working-directory: sigil-pi
        env:
          GH_TOKEN: ${{ github.token }}
        # This workflow publishes candidates, never a GA declaration. Keep the
        # alpha status visible on GitHub as well as in the readiness record.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --prerelease --latest=false \
            --notes "Internal-alpha release candidate; not production-ready. See CHANGELOG.md at this tag and docs/product-readiness.md for scope and outstanding qualification."
