name: Native maintenance diagnostic

'on':
  pull_request:
    paths:
      - 'qualification/native-maintenance/**'
      - '.github/workflows/native-maintenance-diagnostic.yml'

permissions:
  contents: read

jobs:
  native-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      Z3_VERSION: '4.12.2'
      Z3_ASSET: 'z3-4.12.2-x64-glibc-2.35'
      Z3_ASSET_ID: '107922796'
      Z3_SHA256: '29604c87d74855690f5f43fa2ecb8e214af89bdddffac378ce403e29c6ea30ec'
      Z3_SYS_Z3_HEADER: ${{ github.workspace }}/z3-pinned/include/z3.h
      LIBRARY_PATH: ${{ github.workspace }}/z3-pinned/bin
      LD_LIBRARY_PATH: ${{ github.workspace }}/z3-pinned/bin
    steps:
      - name: Set aggregate diagnostic budget
        timeout-minutes: 1
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, time
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('NATIVE_DIAG_DEADLINE_MONOTONIC=' + str(time.monotonic() + 220*60) + '\n')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'maintenance-evidence-meta'
          root.mkdir()
          (root/'job.json').write_text(json.dumps(dict(commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], native_diagnostic_only=True, product_qualified=False)))
          PYCODE
      - timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nxrobins/sigil
          ref: 8277a1d92d599df89e6b4391fc70fd0fa534d696
          path: diagnostic-sigil
          persist-credentials: false
      - timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Verify frozen application and explicit build inputs
        timeout-minutes: 2
        run: python qualification/native-maintenance/prepare.py "$RUNNER_TEMP/maintenance-source"
      - name: Install locked test dependencies
        timeout-minutes: 15
        run: python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/maintenance-source/requirements-dev.lock"
      - name: Install pinned Z3
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl -sSfL --connect-timeout 10 --max-time 60 --retry 3 --retry-delay 2 --retry-max-time 120 -H "Accept: application/octet-stream" -o z3.zip "https://api.github.com/repos/Z3Prover/z3/releases/assets/${Z3_ASSET_ID}"
          echo "${Z3_SHA256}  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          mv "$Z3_ASSET" z3-pinned
          sudo rm -f /usr/local/bin/z3 /usr/local/lib/libz3* /usr/local/include/z3*.h /usr/lib/libz3* /usr/include/z3*.h
          sudo ldconfig
          python "$RUNNER_TEMP/maintenance-source/scripts/ci_z3.py" select --root "$PWD/z3-pinned" --version "$Z3_VERSION"
          sudo python "$RUNNER_TEMP/maintenance-source/scripts/ci_z3.py" install --root "$PWD/z3-pinned" --version "$Z3_VERSION"
          python "$RUNNER_TEMP/maintenance-source/scripts/ci_z3.py" verify --version "$Z3_VERSION"
      - timeout-minutes: 10
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Install pinned Lean verifier
        timeout-minutes: 20
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          toolchain="$(tr -d '\r\n' < diagnostic-sigil/proofs/lean/lean-toolchain)"
          elan toolchain install "$toolchain"
          (cd diagnostic-sigil/proofs/lean && lake env lean --version)
      - name: Build and verify compiler and native components
        run: python qualification/native-maintenance/build.py "$RUNNER_TEMP/maintenance-source" "$PWD/diagnostic-sigil" "$RUNNER_TEMP/maintenance-build"
      - name: Two tenants, concurrent drain, and uninterrupted 130 turns
        run: python qualification/native-maintenance/run.py "$RUNNER_TEMP/maintenance-source" "$PWD/diagnostic-sigil" "$RUNNER_TEMP/maintenance-build" "$RUNNER_TEMP/maintenance-state" "$RUNNER_TEMP/maintenance-observations"
      - name: Retain observations and build logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-maintenance-observations-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/maintenance-evidence-meta/*.json
            ${{ runner.temp }}/maintenance-build/*.json
            ${{ runner.temp }}/maintenance-build/*.log
            ${{ runner.temp }}/maintenance-observations/**
