[package]
name = "sigil-durable-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Scoped opaque-record transactions for the SIGIL execution contract"

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
hmac = "=0.12.1"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "sigil-store"
path = "src/main.rs"
