[pytest]
testpaths = tests
addopts = -q
# Every test has a time limit (audit 2026-11-10, F-17). Without one a hung test held the run
# until the CI job was killed, six hours by GitHub's default, and nothing named it. A test
# that reaches the limit fails with "Failed: Timeout (>1200.0s) from pytest-timeout." and the
# run goes on to report it. The slowest test takes about 25 s on a healthy machine; the limit
# is far above that because on a loaded Mac a new executable can take more than 90 s to
# start, and some tests start several. `signal` interrupts the test itself (the thread method
# would end the whole run, report and coverage with it), and required_plugins makes a venv
# without the plugin an error instead of a setting pytest ignores with a warning. The jobs in
# .github/workflows/ci.yml outlast one test reaching this limit; tests/test_dev_environment.py
# keeps the three in step.
timeout = 1200
timeout_method = signal
required_plugins = pytest-timeout
markers =
    m4: milestone 4 taint proofs
